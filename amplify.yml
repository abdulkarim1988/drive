version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 16 # Forces Node.js 16 (fixes OpenSSL issue)
        - npm install --legacy-peer-deps
    build:
      commands:
        - export NODE_OPTIONS=--openssl-legacy-provider
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - dist/**/*
