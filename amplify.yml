version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 16
        - nvm use 16
        - npm install --legacy-peer-deps
        - npm install aws-amplify @aws-amplify/api-graphql
        - amplify codegen # Regenerates missing GraphQL mutations
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - dist/**/*
