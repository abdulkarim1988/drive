version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 16
        - nvm use 16
        - npm install --legacy-peer-deps
        - npm install aws-amplify @aws-amplify/api-graphql --legacy-peer-deps
        - amplify codegen add --apiId d1ef0z29wobkp2 # Configure GraphQL codegen
        - amplify codegen # Generate GraphQL mutations
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - dist/**/*
